<style>
:root{
  --navy:#1F3864;--blue:#2E5496;--accent:#4472C4;--sky:#8FAADC;
  --bg:#EEF2F9;--card:#fff;--ink:#1B2430;--muted:#6B7688;--line:#E4EAF3;
  --green:#2E9E5B;--greenbg:#EAF3EC;--amber:#C98A12;--amberbg:#FFF7E8;--red:#DB4A4A;--redbg:#FDECEC;
  --luck:#2E5496;--wpc:#5B4BA8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt','Tahoma',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:20px 14px 48px;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto}
svg.ic{width:1em;height:1em;display:inline-block;vertical-align:-0.12em;flex-shrink:0}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding:0 4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:15.5px}
.brand .bi{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.3}
.topright{font-size:12.5px;color:var(--muted);text-align:right}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;background:#fff;border-radius:16px;padding:7px;margin-bottom:16px;box-shadow:0 2px 10px rgba(31,56,100,.07);overflow-x:auto}
.tab{flex:1;min-width:150px;border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:11px 12px;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:.15s}
.tab:hover{background:#F4F7FC;color:var(--navy)}
.tab.on{background:var(--navy);color:#fff}
.tab .num{font-size:11px;opacity:.8;font-weight:500}

/* ---------- week selector ---------- */
.wsel{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.wbtn{border:1px solid var(--line);background:#fff;font-family:inherit;border-radius:13px;padding:10px 15px;cursor:pointer;text-align:left;transition:.15s;flex:1;min-width:180px}
.wbtn:hover{border-color:var(--sky)}
.wbtn .wt{font-size:13.5px;font-weight:700;color:var(--navy)}
.wbtn .wr{font-size:11.5px;color:var(--muted);margin-top:1px}
.wbtn.on{background:var(--navy);border-color:var(--navy)}
.wbtn.on .wt,.wbtn.on .wr{color:#fff}
.wbtn.on .wr{opacity:.78}

/* ---------- business group ---------- */
.biz{margin-bottom:20px}
.bizhead{display:flex;align-items:center;gap:11px;padding:0 4px 9px}
.bizdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.bizname{font-size:16.5px;font-weight:800;color:var(--navy);letter-spacing:-.2px}
.bizsub{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}

/* ---------- channel card ---------- */
.ch{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(31,56,100,.07);margin-bottom:13px;overflow:hidden}
.chhead{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chicon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
.chname{font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.25}
.chname small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.chtag{margin-left:auto;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap}
.tg-ok{background:var(--greenbg);color:#24713F}
.tg-wt{background:var(--amberbg);color:#8A5E07}
.tg-bd{background:var(--redbg);color:#A33}

/* ---------- kpi row ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line)}
.kpi{background:#fff;padding:13px 15px}
.kpi .kl{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.3;min-height:30px}
.kpi .kv{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.4px;line-height:1.15;margin-top:2px}
.kpi .kv.na{color:#C3CDDD;font-weight:600;font-size:17px}

/* ---------- delta ---------- */
.dl{display:inline-flex;align-items:baseline;gap:3px;font-size:11.5px;font-weight:700;margin-top:3px}
.dl.up{color:var(--green)}.dl.dn{color:var(--red)}.dl.nt{color:#8894A8}
.dl .from{font-weight:500;color:#9AA5B5;font-size:10.5px}
.dl.first{color:#A9B3C2;font-weight:500}

/* ---------- table ---------- */
.sec{padding:15px 18px 17px;border-top:1px solid var(--line)}
.sh{font-size:13.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.ss{font-size:11.5px;color:var(--muted);margin:2px 0 10px;line-height:1.5}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
thead th{background:#F4F7FC;color:var(--navy);font-weight:700;text-align:right;padding:9px 11px;white-space:nowrap;border-bottom:1px solid var(--line);font-size:11.5px}
thead th:first-child{text-align:left}
tbody td{padding:9px 11px;text-align:right;border-bottom:1px solid #F1F5FA;vertical-align:top;white-space:nowrap}
tbody td:first-child{text-align:left;white-space:normal;font-weight:600;color:var(--navy);min-width:130px}
tbody tr:last-child td{border-bottom:none}
tbody tr.tot td{background:#F7F9FD;font-weight:700;color:var(--navy)}
tbody tr.grp td{background:#FAFBFE;font-weight:700;color:#5A6B86;font-size:11.5px;letter-spacing:.2px}
tbody tr.grp td:first-child{color:#5A6B86}
td .sub,th .sub{display:block;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:1px}
th .sub{font-size:10px;color:#93A0B3}
.pill{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:20px;background:#EEF2F9;color:#5A6B86;margin-left:5px;vertical-align:1px}
.pill.new{background:#EAF3EC;color:#24713F}
.pill.old{background:#FFF7E8;color:#8A5E07}

/* ---------- notes ---------- */
.note{font-size:12.5px;line-height:1.65;color:#3E4A5C;background:#F7F9FD;border-left:3px solid var(--sky);border-radius:0 9px 9px 0;padding:10px 14px;margin-top:11px}
.note b{color:var(--navy)}
.note.warn{background:var(--amberbg);border-left-color:var(--amber);color:#6E552A}
.note.warn b{color:#8A5E07}
.note.good{background:var(--greenbg);border-left-color:var(--green);color:#2C5738}
.note.good b{color:#1F5F35}
.note.bad{background:var(--redbg);border-left-color:var(--red);color:#7A3030}
.note.bad b{color:#A33}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:9px;padding-left:2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- calendar ---------- */
.cal{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(31,56,100,.07);padding:17px 18px 19px;margin-bottom:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:11px}
.cdow{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:3px}
.cday{border:1px solid var(--line);border-radius:9px;min-height:62px;padding:5px 6px;font-size:11px;position:relative;background:#fff}
.cday.off{background:#FAFBFD;color:#C3CDDD;border-style:dashed}
.cday .dn{font-size:11px;font-weight:700;color:var(--navy)}
.cday.off .dn{color:#C3CDDD}
.cday .ev{font-size:9.5px;line-height:1.35;margin-top:3px;padding:2px 4px;border-radius:5px;font-weight:600}
.cday .ev.g{background:#EDE9FA;color:#4A3C94}
.cday .ev.s{background:#E6EEFA;color:#1F3864}
.cday .ev.x{background:var(--redbg);color:#A33}
.cday .ev.m{background:#FFF1DB;color:#8A5E07}
.cday .ev.n{background:var(--greenbg);color:#24713F}
.callg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:12px}
.callg span{display:inline-flex;align-items:center;gap:5px}
.callg i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- checklist ---------- */
.ckbar{display:flex;align-items:center;gap:13px;background:#fff;border-radius:14px;padding:13px 17px;margin-bottom:13px;box-shadow:0 2px 10px rgba(31,56,100,.07);flex-wrap:wrap}
.ckbar .big{font-size:24px;font-weight:800;color:var(--navy)}
.ckbar .lbl{font-size:12.5px;color:var(--muted)}
.bar{flex:1;min-width:150px;height:9px;border-radius:9px;background:#EDF1F8;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#53B97A);border-radius:9px;transition:width .4s}
.ckgrp{margin-bottom:17px}
.ckgh{font-size:13px;font-weight:700;color:var(--navy);padding:0 4px 8px;display:flex;align-items:center;gap:8px}
.ck{background:#fff;border-radius:13px;box-shadow:0 2px 8px rgba(31,56,100,.06);padding:13px 16px;margin-bottom:9px;display:flex;gap:13px;align-items:flex-start}
.ck input{width:19px;height:19px;margin-top:2px;flex-shrink:0;accent-color:var(--green);cursor:pointer}
.ck .body{flex:1;min-width:0}
.ck .t{font-size:13.5px;font-weight:700;color:var(--navy);line-height:1.4}
.ck .t.done{text-decoration:line-through;color:#9AA5B5}
.ck .d{font-size:12px;color:#4A5563;margin-top:4px;line-height:1.6}
.ck .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-done{background:var(--greenbg);color:#24713F}
.b-open{background:var(--amberbg);color:#8A5E07}
.b-late{background:var(--redbg);color:#A33}
.b-info{background:#EEF2F9;color:#5A6B86}
.ck details{margin-top:8px}
.ck summary{font-size:11.5px;font-weight:700;color:var(--blue);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:5px}
.ck summary::-webkit-details-marker{display:none}
.ck summary:before{content:"▸";transition:.2s;display:inline-block}
.ck details[open] summary:before{transform:rotate(90deg)}
.ck .dd{font-size:12px;color:#4A5563;line-height:1.65;margin-top:7px;padding:9px 13px;background:#F7F9FD;border-radius:9px}
.ck .dd b{color:var(--navy)}

/* ---------- month tab ---------- */
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.mc{background:#fff;border-radius:15px;padding:16px 17px;box-shadow:0 2px 10px rgba(31,56,100,.07);border-top:3px solid var(--blue)}
.mc .ml{font-size:12px;color:var(--muted);font-weight:500}
.mc .mv{font-size:28px;font-weight:800;color:var(--navy);letter-spacing:-.8px;margin-top:3px;line-height:1.1}
.mc .mv small{font-size:15px;font-weight:700}
.mc .ms{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(31,56,100,.07);padding:17px 18px 19px;margin-bottom:14px}
.pbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pbar .pn{width:150px;font-size:12.5px;font-weight:600;color:var(--navy);flex-shrink:0}
.pbar .track{flex:1;background:#EEF2F9;border-radius:8px;height:28px;display:flex;align-items:center}
.pbar .fill{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap;min-width:72px}
.foot{font-size:11.5px;color:var(--muted);line-height:1.7;padding:4px 2px 0}
.foot b{color:var(--navy)}
.pane{display:none}
.pane.on{display:block}
@media(max-width:700px){
  .pbar .pn{width:98px;font-size:11.5px}
  .kpi .kv{font-size:18px}
  .bizsub{margin-left:0;width:100%;text-align:left}
  .calgrid{gap:3px}.cday{min-height:52px;padding:3px 4px}
  .tab{min-width:118px;font-size:12.5px;padding:10px 8px}
  .mc .mv{font-size:23px}
}

/* ---------- platform sub-tabs ---------- */
.csel{display:flex;gap:7px;margin-bottom:15px;flex-wrap:wrap}
.cbtn{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);border-radius:11px;padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;flex:1;min-width:145px;justify-content:center}
.cbtn:hover{border-color:var(--cc);color:var(--cc)}
.cbtn.on{background:var(--cc);border-color:var(--cc);color:#fff}

/* ---------- monthly hero ---------- */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:15px}
.hc{background:#fff;border-radius:16px;padding:18px 19px 19px;box-shadow:0 2px 10px rgba(31,56,100,.07);border-top:4px solid var(--hc);position:relative}
.hc .hl{font-size:12.5px;color:var(--muted);font-weight:600}
.hc .hv{font-size:32px;font-weight:800;color:var(--hc);letter-spacing:-1px;line-height:1.1;margin-top:5px}
.hc .hs{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.55}

/* ---------- weekly / daily sales bars ---------- */
.wsales{margin-top:12px}
.wrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.wrow .wn{width:150px;flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.3}
.wrow .wn span{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
.wrow .wtrack{flex:1;background:#EEF2F9;border-radius:8px;height:32px;display:flex;align-items:center}
.wrow .wfill{height:100%;border-radius:8px;background:linear-gradient(90deg,#2E5496,#4472C4);display:flex;align-items:center;justify-content:flex-end;padding-right:11px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;min-width:92px}
.wrow .wfill.off{background:#C3CDDD;color:#4A5563}
.wrow .wo{width:78px;text-align:right;flex-shrink:0;font-size:11.5px;color:var(--muted);font-weight:600}
@media(max-width:700px){
  .wrow .wn{width:96px;font-size:11.5px}
  .wrow .wo{width:58px;font-size:10.5px}
  .hc .hv{font-size:26px}
  .cbtn{min-width:0;flex:1 1 45%;font-size:11.5px;padding:8px 9px}
}
.hint{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;padding-left:2px;line-height:1.5}
.hint b{color:#5A6B86;font-weight:700}


/* ---------- placeholder / โครงรอกรอก ---------- */
.hc.ph{border-top-style:dashed}
.phv{color:#C3CDDD !important;letter-spacing:2px}
.phw{font-size:11px;font-weight:600;color:#A9B3C2;margin-top:2px}
.phbox{display:flex;align-items:center;gap:13px;border:1.5px dashed #D3DCEA;border-radius:12px;background:#FAFBFD;padding:22px 20px;margin-top:4px;color:#A9B3C2}
.phbox svg.ic{width:26px;height:26px;flex-shrink:0;stroke:#C3CDDD}
.phbox b{display:block;font-size:13px;color:#8894A8;font-weight:700}
.phbox span{display:block;font-size:11.5px;color:#A9B3C2;margin-top:3px;line-height:1.5}
.phtrack{border:1.5px dashed #D3DCEA;background:#FAFBFD !important;justify-content:center}
.phtrack span{font-size:11px;font-weight:600;color:#A9B3C2}
</style>
<style>
/* ---------- vs / MOM compare ---------- */
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line);border-radius:11px;overflow:hidden;border:1px solid var(--line);margin-top:12px}
.vsc{background:#fff;padding:12px 14px}
.vsc .vl{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.3}
.vsc .vr{display:flex;align-items:baseline;gap:8px;margin-top:5px;flex-wrap:wrap}
.vsc .vnow{font-size:18.5px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
.vsc .vold{font-size:11.5px;color:#9AA5B5;font-weight:500}
.vsc .vd{font-size:11px;font-weight:700;margin-top:3px}
.vsc .vd.up{color:var(--green)}.vsc .vd.dn{color:var(--red)}.vsc .vd.nt{color:#8894A8}

/* ---------- campaign block heading ---------- */
.blkh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 9px;padding:9px 13px;background:#F4F7FC;border-left:4px solid var(--blue);border-radius:0 10px 10px 0}
.blkn{font-size:13.5px;font-weight:800;color:var(--navy);letter-spacing:-.2px}
.blkt{font-size:10.5px;font-weight:700;color:#5A6B86;background:#fff;border:1px solid var(--line);padding:2px 9px;border-radius:20px}
.blkb{margin-left:auto;font-size:11.5px;font-weight:700;color:#1F5F35;background:var(--greenbg);padding:3px 11px;border-radius:20px;white-space:nowrap}
@media(max-width:700px){.blkb{margin-left:0}}

/* ---------- status badge ---------- */
.st{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.st-done{background:var(--greenbg);color:#24713F}
.st-doing{background:#E6EEFA;color:#1F3864}
.st-todo{background:#EEF2F9;color:#5A6B86}
.st-stuck{background:var(--redbg);color:#A33}
.st-due{background:var(--amberbg);color:#8A5E07}

/* ---------- placeholder ---------- */
.hc.ph{border-top-style:dashed}
.phv{color:#C3CDDD !important;letter-spacing:2px}
.phw{font-size:11px;font-weight:600;color:#A9B3C2;margin-top:2px}
.phbox{display:flex;align-items:center;gap:13px;border:1.5px dashed #D3DCEA;border-radius:12px;background:#FAFBFD;padding:22px 20px;margin-top:4px;color:#A9B3C2}
.phbox svg.ic{width:26px;height:26px;flex-shrink:0;stroke:#C3CDDD}
.phbox b{display:block;font-size:13px;color:#8894A8;font-weight:700}
.phbox span{display:block;font-size:11.5px;color:#A9B3C2;margin-top:3px;line-height:1.5}

/* ---------- kpi note ---------- */
.kpinote{font-size:11.5px;color:var(--muted);line-height:1.55;padding:9px 18px 0;background:#fff}

/* ---------- expandable row ---------- */

/* ============================================================
   RENDER
   ============================================================ */
function ic(n,c){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="'+(c||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';}
function fmt(n,d){if(n===null||n===undefined||isNaN(n))return '—';
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function vtxt(o){
  var neg=(typeof o.n==='number'&&o.n<0);
  return (neg?'−':'')+(o.pre||'')+fmt(Math.abs(o.n),o.dec)+(o.suf||'');
}
function cellHTML(c){
  if(c===null||c===undefined)return '<td>—</td>';
  if(typeof c==='string')return '<td>'+c+'</td>';
  return '<td>'+vtxt(c)+'</td>';
}

/* ---- การ์ด KPI ---- */
function arrow(a){return a==='up'?'▲ ':(a==='dn'?'▼ ':'● ');}
function toneCls(t){return t>0?'up':(t<0?'dn':'nt');}
function kpiRow(ch){
  var h='<div class="kpis">'+ch.kpi.map(function(k){
    var d=k.cmp
      ? '<span class="dl '+toneCls(k.cmp.tone)+'">'+arrow(k.cmp.ar)+k.cmp.txt+' <span class="from">จาก '+k.cmp.from+'</span></span>'
      : '<span class="dl first">ไม่มีให้เทียบ</span>';
    return '<div class="kpi"><div class="kl">'+k.l+'</div>'+
           '<div class="kv">'+(k.pre||'')+fmt(k.n,k.dec)+(k.suf||'')+'</div><div>'+d+'</div></div>';
  }).join('')+'</div>';
  if(ch.kpiNote)h+='<div class="kpinote">'+ch.kpiNote+'</div>';
  return h;
}

/* ---- การ์ดเทียบเดือนก่อน (MoM) ---- */
function vsHTML(v){
  if(!v)return '';
  var h='<div class="sec"><div class="sh">'+ic('chart')+' '+v.label+'</div>';
  if(v.sub)h+='<div class="ss">'+v.sub+'</div>';
  h+='<div class="vs">'+v.items.map(function(i){
    var cls=toneCls(i.d), ar=arrow(i.ar);
    return '<div class="vsc"><div class="vl">'+i.l+'</div>'+
           '<div class="vr"><span class="vnow">'+i.now+'</span><span class="vold">ก.ย. '+i.old+'</span></div>'+
           '<div class="vd '+cls+'">'+ar+i.dt+'</div></div>';
  }).join('')+'</div></div>';
  return h;
}

/* ---- ตาราง ---- */
function tableGrid(t,extra){
  var h='<div class="tw"><table'+(t.minw?' style="min-width:'+t.minw+'px"':'')+'><thead><tr>'+
        t.cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>';
  t.rows.forEach(function(r){ h+='<tr>'+r.map(cellHTML).join('')+'</tr>'; });
  if(t.tot)h+='<tr class="tot">'+t.tot.map(cellHTML).join('')+'</tr>';
  if(extra)h+=extra;
  return h+'</tbody></table></div>';
}
function hintLine(t){
  var up=[],dn=[];
  (t.dirs||[]).forEach(function(x,i){ if(x==='up')up.push(t.cols[i]); else if(x==='dn')dn.push(t.cols[i]); });
  if(!up.length&&!dn.length)return '';
  return '<div class="hint">'+
     (up.length?'<span><b>ยิ่งมากยิ่งดี</b> '+up.join(' · ')+'</span>':'')+
     (dn.length?'<span><b>ยิ่งน้อยยิ่งดี</b> '+dn.join(' · ')+'</span>':'')+'</div>';
}
function tableHTML(t){
  var h='<div class="sec">';
  if(t.blk){
    h+='<div class="blkh"><span class="blkn">'+t.blk.n+'</span>'+
       (t.blk.t?'<span class="blkt">'+t.blk.t+'</span>':'')+
       (t.blk.b?'<span class="blkb">'+t.blk.b+'</span>':'')+'</div>';
  } else {
    h+='<div class="sh">'+ic('chart')+' '+t.label+'</div>';
  }
  if(t.sub)h+='<div class="ss">'+t.sub+'</div>';
  if(t.coll){
    var c=t.coll;
    h+='<div class="exstand"><button class="exbtn" data-ex="'+c.id+'">'+
       '<span class="exar">▸</span> '+c.label+' <span class="excount">'+c.count+'</span></button></div>'+
       '<div class="expanel2" id="ex-'+c.id+'" hidden>'+
       (c.table.sub?'<div class="ss" style="margin:0 0 9px">'+c.table.sub+'</div>':'')+
       tableGrid(c.table)+hintLine(c.table)+
       (c.table.note?'<div class="note">'+c.table.note+'</div>':'')+'</div>';
    return h+'</div>';
  }
  var extra='';
  if(t.expand){
    var e=t.expand, n=t.cols.length;
    extra='<tr class="exrow"><td colspan="'+n+'"><button class="exbtn" data-ex="'+e.id+'">'+
          '<span class="exar">▸</span> '+e.label+' <span class="excount">'+e.count+'</span></button></td></tr>'+
          '<tr class="expanel" id="ex-'+e.id+'" hidden><td colspan="'+n+'">'+
          (e.table.sub?'<div class="ss" style="margin:2px 0 9px">'+e.table.sub+'</div>':'')+
          tableGrid(e.table)+hintLine(e.table)+'</td></tr>';
  }
  h+=tableGrid(t,extra)+hintLine(t);
  if(t.note)h+='<div class="note">'+t.note+'</div>';
  return h+'</div>';
}

/* ---- โครงสร้างแคมเปญ (การ์ด) ---- */
function statStrip(arr,cls){
  return '<div class="'+cls+'">'+arr.map(function(s){
    return '<div class="csst'+(s.g?' good':'')+'"><div class="l">'+s.l+'</div>'+
           '<div class="v">'+(typeof s.v==='string'?s.v:vtxt(s.v))+'</div></div>';
  }).join('')+'</div>';
}
function structHTML(t){
  var h='<div class="sec"><div class="sh">'+ic('chart')+' '+t.label+'</div>';
  if(t.sub)h+='<div class="ss">'+t.sub+'</div>';
  var solo=(t.ags.length===1);
  h+='<div class="cstr"><div class="cshd"><span class="csnm">'+t.cmp.n+'</span>'+
     '<span class="cstag">แคมเปญ</span></div>'+statStrip(t.cmp.s,'csstats');
  h+='<div class="csagw">'+t.ags.map(function(a){
    var x='<div class="csag"><div class="csaghd"><span class="csagnm">'+a.n+'</span>'+
          '<span class="csagtag">Ad Group</span>'+
          (solo?'<span class="csagsame">กลุ่มเดียวในแคมเปญนี้ · ตัวเลขเท่ากับระดับแคมเปญ</span>':'')+'</div>';
    if(!solo)x+=statStrip(a.s,'csstats ag');
    if(a.kw){
      x+='<button class="exbtn" data-ex="'+a.kw.id+'"><span class="exar">▸</span> Keywords '+
         '<span class="excount">'+a.kw.count+'</span></button>'+
         '<div class="cskwp" id="ex-'+a.kw.id+'" hidden>'+
         (a.kw.table.sub?'<div class="ss" style="margin:0 0 9px">'+a.kw.table.sub+'</div>':'')+
         tableGrid(a.kw.table)+hintLine(a.kw.table)+'</div>';
    }
    return x+'</div>';
  }).join('')+'</div></div>';
  if(t.note)h+='<div class="note">'+t.note+'</div>';
  return h+'</div>';

  if(p.opts){
    h+='<div class="optsel">'+p.opts.map(function(o,i){
      return '<button class="optbtn'+(i===0?' on':'')+'" data-opt="'+o.id+'" data-grp="'+key+'">'+
             '<div class="o1">'+o.n+(o.rec?'<span class="optrec">ผมแนะนำ</span>':'')+'</div>'+
             '<div class="o2">'+o.t+'</div></button>';
    }).join('')+'</div>';
    h+=p.opts.map(function(o,i){
      return '<div class="optpane" id="opt-'+key+'-'+o.id+'"'+(i===0?'':' hidden')+'>'+
             '<div class="optd">'+o.d+'</div>'+o.posts.map(ipostHTML).join('')+'</div>';
    }).join('');
  } else {
    h+=p.posts.map(ipostHTML).join('');
  }
  if(p.note)h+='<div class="note">'+p.note+'</div>';
  if(p.dropped)h+='<div class="note warn">'+p.dropped+'</div>';
  return h+'</div>';
}

/* ---- ปฏิทินของแต่ละช่องทาง ---- */
function calHTML(c){
  if(!c)return '';
  var DOW=['อา','จ','อ','พ','พฤ','ศ','ส'], first=new Date(2026,9,1).getDay();
  var h='<div class="sec"><div class="sh">'+ic('cal')+' '+c.title+'</div><div class="ss">'+c.note+'</div><div class="calgrid">';
  DOW.forEach(function(d){h+='<div class="cdow">'+d+'</div>';});
  for(var i=0;i<first;i++)h+='<div class="cday off"></div>';
  for(var d=1;d<=31;d++){
    var ev=c.events[d]||[];
    var off=(d>c.lastData&&ev.length===0)?' off':'';
    h+='<div class="cday'+off+'"><div class="dn">'+d+'</div>'+
       ev.map(function(e){return '<div class="ev '+e.k+'">'+e.t+'</div>';}).join('')+'</div>';
  }
  h+='</div><div class="callg">'+c.legend.map(function(l){
      return '<span><i style="background:'+l[0]+'"></i>'+l[1]+'</span>';
    }).join('')+'<span style="color:#9AA5B5">วันที่จางคือยังไม่มีข้อมูล</span></div></div>';
  return h;
}

/* ---- Action Plan ของแต่ละช่องทาง ---- */
var ST_OPTS=[['todo','ยังไม่ดำเนินการ'],['doing','ดำเนินการ'],['done','เสร็จสิ้น']];
function planHTML(p,key){
  if(!p)return '';
  var d=planState(key);
  var h='<div class="sec"><div class="sh">'+ic('check')+' '+p.title+'</div>';
  if(p.note)h+='<div class="ss">'+p.note+'</div>';
  h+='<div class="tw"><table style="min-width:700px"><thead><tr>'+
     '<th style="width:38px"></th><th style="text-align:left">งานที่ต้องทำ</th><th style="text-align:left;width:150px">สถานะ</th>'+
     '<th style="text-align:left;width:130px">วันที่ทำจริง</th><th style="text-align:left">หมายเหตุ</th></tr></thead><tbody>';
  p.rows.forEach(function(row,i){
    var id=key+'-'+i, v=d[id]||{};
    var cur=v.st||'todo', on=cur==='done';
    h+='<tr><td style="text-align:center"><input type="checkbox" class="apck" data-id="'+id+'" data-key="'+key+'"'+(on?' checked':'')+'></td>'+
       '<td class="aptask'+(on?' done':'')+'">'+row[0]+'</td>'+
       '<td style="text-align:left"><select class="apsel st-'+cur+'" data-id="'+id+'" data-key="'+key+'">'+
         ST_OPTS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>';}).join('')+
       '</select></td>'+
       '<td style="text-align:left"><input type="date" class="apin apdate" data-f="dt" data-id="'+id+'" data-key="'+key+'" value="'+(v.dt||'')+'"></td>'+
       '<td style="text-align:left"><input type="text" class="apin wide" data-f="rm" data-id="'+id+'" data-key="'+key+'" value="'+(v.rm||'').replace(/"/g,'&quot;')+'"></td></tr>';
  });
  h+='</tbody></table></div><div class="foot" style="padding-top:8px">สถานะ วันที่ และหมายเหตุที่กรอก จะเก็บไว้ในเบราว์เซอร์ของเครื่องที่กรอกเท่านั้น · คนอื่นที่เปิดลิงก์จะไม่เห็น และจะหายถ้าล้างข้อมูลเบราว์เซอร์ · ถ้าต้องการให้ทีมเห็นด้วย ให้ส่งข้อความมาแล้วจะฝังลงไฟล์ให้ถาวร</div></div>';
  return h;
}
function planState(key){try{return JSON.parse(localStorage.getItem('apfield-2569-10-'+key)||'{}');}catch(e){return {};}}
function planSave(key,s){try{localStorage.setItem('apfield-2569-10-'+key,JSON.stringify(s));}catch(e){}}
function planSet(key,id,patch){var s=planState(key); s[id]=Object.assign({},s[id]||{},patch); planSave(key,s); return s[id];}

/* ---- ช่องทาง ---- */
function channelHTML(ch){
  var h='<div class="ch"><div class="chhead">'+
    '<div class="chicon" style="background:'+ch.color+'">'+ic(ch.icon,'#fff')+'</div>'+
    '<div class="chname">'+ch.name+'<small>'+((ch.bizName&&ch.bizName!==ch.name)?ch.bizName+' · ':'')+ch.sub+'</small></div>';
  if(ch.tag)h+='<div class="chtag tg-'+ch.tag[1]+'">'+ch.tag[0]+'</div>';
  h+='</div>';
  if(ch.igplan){
    h+=igPlanHTML(ch.igplan,ch.key)+calHTML(ch.cal)+planHTML(ch.plan,ch.key);
    return h+'</div>';
  }
  h+=kpiRow(ch)+vsHTML(ch.vs);
  (ch.tables||[]).forEach(function(t){h+=(t.struct?structHTML(t):tableHTML(t));});
  if(ch.changes&&ch.changes.length){
    h+='<div class="sec"><div class="sh">'+ic('cal')+' สิ่งที่ปรับระหว่างสัปดาห์</div><div class="tw"><table style="min-width:420px"><thead><tr><th>วันที่</th><th style="text-align:left">การเปลี่ยนแปลง</th></tr></thead><tbody>'+
      ch.changes.map(function(c){return '<tr><td>'+c[0]+'</td><td style="text-align:left;white-space:normal;font-weight:500;color:#3E4A5C">'+c[1]+'</td></tr>';}).join('')+
      '</tbody></table></div></div>';
  }
  if(ch.notes&&ch.notes.length){
    h+='<div class="sec">'+ch.notes.map(function(n){return '<div class="note '+(n.k||'')+'">'+n.t+'</div>';}).join('')+'</div>';
  }
  h+=calHTML(ch.cal)+planHTML(ch.plan,ch.key);
  return h+'</div>';
}

/* ---- แท็บรายสัปดาห์ ---- */
var curWeek=0, curCh=0;
function flatCh(w){
  var out=[];
  w.biz.forEach(function(b){ b.ch.forEach(function(c){ var o=Object.assign({},c); o.bizName=b.name; out.push(o); }); });
  return out;
}
function weekPane(){
  var w=WEEKS[curWeek], list=flatCh(w), h='';
  if(curCh>=list.length)curCh=0;
  h+='<div class="wsel">'+WEEKLIST.map(function(x){
    var off=(x.i===undefined);
    return '<button class="wbtn'+(!off&&x.i===curWeek?' on':'')+(off?' off':'')+'"'+
           (off?' disabled':' data-w="'+x.i+'"')+'><div class="wt">'+x.n+'</div>'+
           '<div class="wr">'+x.r+'</div></button>';
  }).join('')+'</div>';
  h+='<div class="csel">'+list.map(function(c,i){
    return '<button class="cbtn'+(i===curCh?' on':'')+'" data-c="'+i+'" style="--cc:'+c.color+'">'+ic(c.icon)+' '+c.name+'</button>';
  }).join('')+'</div>';
  h+='<div class="card" style="padding:14px 18px"><div class="sh">'+ic('layers')+' '+w.n+' · '+w.full+'</div><div class="ss" style="margin-bottom:0">'+w.head+'</div></div>';
  h+=channelHTML(list[curCh]);
  return h;
}
function bindWeek(){
  document.querySelectorAll('.wbtn[data-w]').forEach(function(b){
    b.onclick=function(){curWeek=+b.getAttribute('data-w');curCh=0;draw();window.scrollTo({top:0,behavior:'smooth'});};
  });
  document.querySelectorAll('.cbtn').forEach(function(b){
    b.onclick=function(){curCh=+b.getAttribute('data-c');draw();window.scrollTo({top:0,behavior:'smooth'});};
  });
  document.querySelectorAll('.exbtn').forEach(function(b){
    b.onclick=function(){
      var p=document.getElementById('ex-'+b.getAttribute('data-ex'));
      var open=p.hasAttribute('hidden');
      if(open)p.removeAttribute('hidden'); else p.setAttribute('hidden','');
      b.querySelector('.exar').textContent=open?'▾':'▸';
      b.classList.toggle('on',open);
    };
  });
  document.querySelectorAll('.optbtn').forEach(function(b){
    b.onclick=function(){
      var g=b.getAttribute('data-grp');
      document.querySelectorAll('.optbtn[data-grp="'+g+'"]').forEach(function(x){
        x.classList.toggle('on', x===b);
        var pane=document.getElementById('opt-'+g+'-'+x.getAttribute('data-opt'));
        if(pane){ if(x===b)pane.removeAttribute('hidden'); else pane.setAttribute('hidden',''); }
      });
    };
  });
  document.querySelectorAll('.apck').forEach(function(b){
    b.onchange=function(){
      var key=b.getAttribute('data-key'), id=b.getAttribute('data-id');
      var st=b.checked?'done':'todo';
      planSet(key,id,{st:st});
      var tr=b.closest('tr'), sel=tr.querySelector('.apsel');
      sel.value=st; sel.className='apsel st-'+st;
      tr.querySelector('.aptask').classList.toggle('done',b.checked);
    };
  });
  document.querySelectorAll('.apsel').forEach(function(s){
    s.onchange=function(){
      var key=s.getAttribute('data-key'), id=s.getAttribute('data-id');
      planSet(key,id,{st:s.value});
      s.className='apsel st-'+s.value;
      var tr=s.closest('tr');
      tr.querySelector('.apck').checked=(s.value==='done');
      tr.querySelector('.aptask').classList.toggle('done',s.value==='done');
    };
  });
  document.querySelectorAll('.apin').forEach(function(x){
    x.oninput=function(){
      var o={}; o[x.getAttribute('data-f')]=x.value;
      planSet(x.getAttribute('data-key'),x.getAttribute('data-id'),o);
    };
  });
}

/* ---- แท็บ Monthly Summary ---- */
function monthPane(){
  var M=MONTH, W=M.waitText;
  var h='<div class="note warn" style="margin-bottom:15px;border-radius:12px;border-left-width:4px;padding:13px 16px">'+M.banner+'</div>';
  h+='<div class="hero">'+M.hero.map(function(c){
    if(c.v)return '<div class="hc" style="--hc:'+c.c+'"><div class="hl">'+c.l+'</div><div class="hv">'+c.v+'</div><div class="hs">'+c.s+'</div></div>';
    return '<div class="hc ph" style="--hc:'+c.c+'"><div class="hl">'+c.l+'</div><div class="hv phv">—</div><div class="phw">'+W+'</div><div class="hs">'+c.s+'</div></div>';
  }).join('')+'</div>';

  var mx=Math.max.apply(null,M.channels.map(function(c){return c.spend;}));
  h+='<div class="card"><div class="sh">'+ic('sum')+' ค่าโฆษณาแยกตามช่องทาง</div><div class="ss">สะสมถึงสัปดาห์ที่ 1 · รวม ฿'+fmt(5094.11,2)+'</div>';
  M.channels.forEach(function(c){
    h+='<div class="pbar"><div class="pn">'+c.n+'<span class="sub" style="display:block;font-weight:500;font-size:10.5px;color:var(--muted)">'+c.res+'</span></div>'+
       '<div class="track"><div class="fill" style="width:'+Math.max(10,c.spend/mx*100)+'%;background:'+c.color+'">฿'+fmt(c.spend,2)+' · '+c.pct.toFixed(1)+'%</div></div></div>';
  });
  h+='<div class="note">'+M.chNote+'</div></div>';

  h+='<div class="card"><div class="sh">'+ic('chart')+' '+M.dailyTitle+'</div><div class="ss">'+M.dailySub+'</div>'+
     '<div class="phbox">'+ic('chart')+'<div><b>'+W+'</b><span>จะแสดงแท่งยอดขายรายวันของเดือนตุลาคม พร้อมจำนวนออเดอร์ของแต่ละวัน</span></div></div></div>';

  h+='<div class="foot" style="background:#fff;border-radius:14px;padding:15px 18px;box-shadow:0 2px 10px rgba(31,56,100,.07)">'+M.foot+'</div>';
  return h;
}

/* ---- แท็บ ---- */
var TABS=[
 {k:'week', n:'Weekly', i:'layers', s:'4 weeks'},
 {k:'month',n:'Monthly Summary', i:'sum', s:'Oct 2026'}
];
var curTab=0;
function draw(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t,i){
    return '<button class="tab'+(i===curTab?' on':'')+'" data-t="'+i+'">'+ic(t.i)+' '+t.n+' <span class="num">'+t.s+'</span></button>';
  }).join('');
  document.getElementById('panes').innerHTML='<div class="pane on">'+(curTab===0?weekPane():monthPane())+'</div>';
  document.getElementById('globalfoot').innerHTML=
    'แดชบอร์ดนี้รวมรายสัปดาห์และสรุปรายเดือนไว้ในไฟล์เดียว · เดือนตุลาคม 2569 มี 4 ช่องทาง — Shopee Ads LUCK และ Google Ads WPC ยิงแล้วและมีตัวเลขจริง ส่วน IG LUCK และ IG ATELIER ยังเป็นแผน กำหนดเริ่ม 13 ต.ค. ตัวเลขในสองแท็บนั้นเป็นผลของเดือนกันยายนที่ใช้เลือกโพสต์ · ตัวเลข Shopee ในแท็บ Weekly เป็นของแคมเปญรอบใหม่ที่เปิด 5 ต.ค. เท่านั้น ส่วนการ์ดงบประมาณใช้ยอดตัดเครดิตจริงจากบัญชี · ช่วงข้อมูลแต่ละช่องทางไม่เท่ากัน Shopee 5–8 ต.ค. และ Google Ads 1–7 ต.ค. จึงอ่านตัวเลขแยกกันเสมอ · Action Plan และปฏิทินอยู่ท้ายการ์ดของแต่ละช่องทาง';
  document.querySelectorAll('.tab').forEach(function(b){
    b.onclick=function(){curTab=+b.getAttribute('data-t');draw();window.scrollTo({top:0,behavior:'smooth'});};
  });
  if(curTab===0)bindWeek();
}
draw();

</script>
