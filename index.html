*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt','Tahoma',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:20px 14px 48px;-webkit-text-size-adjust:100%}

.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:15.5px}
.brand .bi{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}

.bizdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

.tg-ok{background:var(--greenbg);color:#24713F}
.tg-wt{background:var(--amberbg);color:#8A5E07}

/* ---------- kpi row ---------- */

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
thead th{background:#F4F7FC;color:var(--navy);font-weight:700;text-align:right;padding:9px 11px;white-space:nowrap;border-bottom:1px solid var(--line);font-size:11.5px}

tbody td{padding:9px 11px;text-align:right;border-bottom:1px solid #F1F5FA;vertical-align:top;white-space:nowrap}

.pill{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:20px;background:#EEF2F9;color:#5A6B86;margin-left:5px;vertical-align:1px}
.pill.new{background:#EAF3EC;color:#24713F}
.pill.old{background:#FFF7E8;color:#8A5E07}

/* ---------- notes ---------- */
.note{font-size:12.5px;line-height:1.65;color:#3E4A5C;background:#F7F9FD;border-left:3px solid var(--sky);border-radius:0 9px 9px 0;padding:10px 14px;margin-top:11px}
.note b{color:var(--navy)}
.note.warn{background:var(--amberbg);border-left-color:var(--amber);color:#6E552A}
.note.warn b{color:#8A5E07}
.note.good{background:var(--greenbg);border-left-color:var(--green);color:#2C5738}
.note.good b{color:#1F5F35}
.note.bad{background:var(--redbg);border-left-color:var(--red);color:#7A3030}
.note.bad b{color:#A33}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:9px;padding-left:2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- calendar ---------- */
.cal{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(31,56,100,.07);padding:17px 18px 19px;margin-bottom:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:11px}
.cdow{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:3px}
.cday{border:1px solid var(--line);border-radius:9px;min-height:62px;padding:5px 6px;font-size:11px;position:relative;background:#fff}
.cday.off{background:#FAFBFD;color:#C3CDDD;border-style:dashed}
.cday .dn{font-size:11px;font-weight:700;color:var(--navy)}
.cday.off .dn{color:#C3CDDD}
.cday .ev{font-size:9.5px;line-height:1.35;margin-top:3px;padding:2px 4px;border-radius:5px;font-weight:600}
.cday .ev.g{background:#EDE9FA;color:#4A3C94}
.cday .ev.s{background:#E6EEFA;color:#1F3864}
.cday .ev.x{background:var(--redbg);color:#A33}
.cday .ev.n{background:var(--greenbg);color:#24713F}
.callg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:12px}
.callg span{display:inline-flex;align-items:center;gap:5px}
.callg i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- checklist ---------- */
.ckbar{display:flex;align-items:center;gap:13px;background:#fff;border-radius:14px;padding:13px 17px;margin-bottom:13px;box-shadow:0 2px 10px rgba(31,56,100,.07);flex-wrap:wrap}
.ckbar .big{font-size:24px;font-weight:800;color:var(--navy)}
.ckbar .lbl{font-size:12.5px;color:var(--muted)}
.bar{flex:1;min-width:150px;height:9px;border-radius:9px;background:#EDF1F8;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#53B97A);border-radius:9px;transition:width .4s}
.ckgrp{margin-bottom:17px}
.ckgh{font-size:13px;font-weight:700;color:var(--navy);padding:0 4px 8px;display:flex;align-items:center;gap:8px}
.ck{background:#fff;border-radius:13px;box-shadow:0 2px 8px rgba(31,56,100,.06);padding:13px 16px;margin-bottom:9px;display:flex;gap:13px;align-items:flex-start}
.ck input{width:19px;height:19px;margin-top:2px;flex-shrink:0;accent-color:var(--green);cursor:pointer}
.ck .body{flex:1;min-width:0}
.ck .t{font-size:13.5px;font-weight:700;color:var(--navy);line-height:1.4}
.ck .t.done{text-decoration:line-through;color:#9AA5B5}
.ck .d{font-size:12px;color:#4A5563;margin-top:4px;line-height:1.6}
.ck .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-done{background:var(--greenbg);color:#24713F}
.b-open{background:var(--amberbg);color:#8A5E07}
.b-late{background:var(--redbg);color:#A33}
.b-info{background:#EEF2F9;color:#5A6B86}
.ck details{margin-top:8px}
.ck summary{font-size:11.5px;font-weight:700;color:var(--blue);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:5px}
.ck summary::-webkit-details-marker{display:none}
.ck summary:before{content:"▸";transition:.2s;display:inline-block}
.ck details[open] summary:before{transform:rotate(90deg)}
.ck .dd{font-size:12px;color:#4A5563;line-height:1.65;margin-top:7px;padding:9px 13px;background:#F7F9FD;border-radius:9px}
.ck .dd b{color:var(--navy)}

/* ---------- month tab ---------- */
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.mc{background:#fff;border-radius:15px;padding:16px 17px;box-shadow:0 2px 10px rgba(31,56,100,.07);border-top:3px solid var(--blue)}
.mc .ml{font-size:12px;color:var(--muted);font-weight:500}
.mc .mv{font-size:28px;font-weight:800;color:var(--navy);letter-spacing:-.8px;margin-top:3px;line-height:1.1}
.mc .mv small{font-size:15px;font-weight:700}
.mc .ms{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(31,56,100,.07);padding:17px 18px 19px;margin-bottom:14px}
.pbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pbar .pn{width:150px;font-size:12.5px;font-weight:600;color:var(--navy);flex-shrink:0}
.pbar .track{flex:1;background:#EEF2F9;border-radius:8px;height:28px;display:flex;align-items:center}
.pbar .fill{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap;min-width:72px}
.foot{font-size:11.5px;color:var(--muted);line-height:1.7;padding:4px 2px 0}
.foot b{color:var(--navy)}
.pane{display:none}
.pane.on{display:block}
@media(max-width:700px){
  .pbar .pn{width:98px;font-size:11.5px}
  .kpi .kv{font-size:18px}
  .bizsub{margin-left:0;width:100%;text-align:left}
  .calgrid{gap:3px}.cday{min-height:52px;padding:3px 4px}
  .tab{min-width:118px;font-size:12.5px;padding:10px 8px}
  .mc .mv{font-size:23px}
}

/* ---------- platform sub-tabs ---------- */
.csel{display:flex;gap:7px;margin-bottom:15px;flex-wrap:wrap}
.cbtn{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);border-radius:11px;padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;flex:1;min-width:145px;justify-content:center}
.cbtn:hover{border-color:var(--cc);color:var(--cc)}
.cbtn.on{background:var(--cc);border-color:var(--cc);color:#fff}

/* ---------- monthly hero ---------- */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:15px}
.hc{background:#fff;border-radius:16px;padding:18px 19px 19px;box-shadow:0 2px 10px rgba(31,56,100,.07);border-top:4px solid var(--hc);position:relative}
.hc .hl{font-size:12.5px;color:var(--muted);font-weight:600}
.hc .hv{font-size:32px;font-weight:800;color:var(--hc);letter-spacing:-1px;line-height:1.1;margin-top:5px}
.hc .hs{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.55}

/* ---------- weekly / daily sales bars ---------- */
.wsales{margin-top:12px}
.wrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.wrow .wn{width:150px;flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.3}
.wrow .wn span{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
.wrow .wtrack{flex:1;background:#EEF2F9;border-radius:8px;height:32px;display:flex;align-items:center}
.wrow .wfill{height:100%;border-radius:8px;background:linear-gradient(90deg,#2E5496,#4472C4);display:flex;align-items:center;justify-content:flex-end;padding-right:11px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;min-width:92px}
.wrow .wfill.off{background:#C3CDDD;color:#4A5563}
.wrow .wo{width:78px;text-align:right;flex-shrink:0;font-size:11.5px;color:var(--muted);font-weight:600}
@media(max-width:700px){
  .wrow .wn{width:96px;font-size:11.5px}
  .wrow .wo{width:58px;font-size:10.5px}
  .hc .hv{font-size:26px}
  .cbtn{min-width:0;flex:1 1 45%;font-size:11.5px;padding:8px 9px}
}
.hint{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;padding-left:2px;line-height:1.5}
.hint b{color:#5A6B86;font-weight:700}


/* ---------- placeholder / โครงรอกรอก ---------- */
.hc.ph{border-top-style:dashed}
.phv{color:#C3CDDD !important;letter-spacing:2px}
.phw{font-size:11px;font-weight:600;color:#A9B3C2;margin-top:2px}
.phbox{display:flex;align-items:center;gap:13px;border:1.5px dashed #D3DCEA;border-radius:12px;background:#FAFBFD;padding:22px 20px;margin-top:4px;color:#A9B3C2}
.phbox svg.ic{width:26px;height:26px;flex-shrink:0;stroke:#C3CDDD}
.phbox b{display:block;font-size:13px;color:#8894A8;font-weight:700}
.phbox span{display:block;font-size:11.5px;color:#A9B3C2;margin-top:3px;line-height:1.5}
.phtrack{border:1.5px dashed #D3DCEA;background:#FAFBFD !important;justify-content:center}
.phtrack span{font-size:11px;font-weight:600;color:#A9B3C2}
</style>

/* ============================================================
   RENDER
   ============================================================ */
function ic(n,c){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="'+(c||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';}
function fmt(n,d){if(n===null||n===undefined||isNaN(n))return '—';
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function vtxt(o){
  var neg = (typeof o.n==='number' && o.n<0);
  var body = fmt(Math.abs(o.n),o.dec);
  return (neg?'−':'')+(o.pre||'')+body+(o.suf||'');
}

/* ---- ส่วนต่างเทียบรอบก่อน ---- */
function delta(o,dir){
  if(o.n===null||o.n===undefined)return '';
  if(o.p===null||o.p===undefined)return '';
  var diff=o.n-o.p, d=o.dec||0;
  var cls='nt', arrow='';
  if(Math.abs(diff)<Math.pow(10,-(d+1))){return '<span class="dl nt">เท่าเดิม</span>';}
  if(diff>0){arrow='▲';} else {arrow='▼';}
  if(dir==='up')cls=diff>0?'up':'dn';
  else if(dir==='dn')cls=diff<0?'up':'dn';
  var sign=diff>0?'+':'−';
  var body=sign+(o.pre||'')+fmt(Math.abs(diff),d)+(o.suf||'');
  return '<span class="dl '+cls+'">'+arrow+' '+body+' <span class="from">จาก '+(o.pre||'')+fmt(o.p,d)+(o.suf||'')+'</span></span>';
}

/* ---- การ์ด KPI ---- */
function kpiRow(list){
  return '<div class="kpis">'+list.map(function(k){
    var v=(k.n===null||k.n===undefined)
      ? '<div class="kv na">ไม่มีข้อมูล</div>'
      : '<div class="kv">'+(k.pre||'')+fmt(k.n,k.dec)+(k.suf||'')+'</div>';
    var dd=delta(k,k.dir);
    if(!dd&&k.n!==null&&k.n!==undefined)dd='<span class="dl first">สัปดาห์แรก · ไม่มีให้เทียบ</span>';
    return '<div class="kpi"><div class="kl">'+k.l+'</div>'+v+'<div>'+dd+'</div></div>';
  }).join('')+'</div>';
}

/* ---- ตาราง ---- */
function cellHTML(c){
  if(c===null||c===undefined)return '<td>—</td>';
  if(typeof c==='string')return '<td>'+c+'</td>';
  return '<td>'+vtxt(c)+'</td>';
}
function tableHTML(t){
  var h='<div class="sec"><div class="sh">'+ic('chart')+' '+t.label+'</div>';
  if(t.sub)h+='<div class="ss">'+t.sub+'</div>';
  h+='<div class="tw"><table><thead><tr>'+t.cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>';
  t.rows.forEach(function(r){
    if(r[0]&&typeof r[0]==='object'&&r[0].grp){
      h+='<tr class="grp"><td colspan="'+t.cols.length+'">'+r[1]+'</td></tr>';
      return;
    }
    h+='<tr>'+r.map(function(c,i){return cellHTML(c);}).join('')+'</tr>';
  });
  if(t.tot)h+='<tr class="tot">'+t.tot.map(function(c,i){return cellHTML(c);}).join('')+'</tr>';
  h+='</tbody></table></div>';
  var up=[],dn=[];
  (t.dirs||[]).forEach(function(x,i){ if(x==='up')up.push(t.cols[i]); else if(x==='dn')dn.push(t.cols[i]); });
  if(up.length||dn.length){
    h+='<div class="hint">'+
       (up.length?'<span><b>ยิ่งมากยิ่งดี</b> '+up.join(' · ')+'</span>':'')+
       (dn.length?'<span><b>ยิ่งน้อยยิ่งดี</b> '+dn.join(' · ')+'</span>':'')+'</div>';
  }
  if(t.note)h+='<div class="note">'+t.note+'</div>';
  h+='</div>';
  return h;
}

/* ---- ช่องทาง ---- */
function channelHTML(ch){
  var h='<div class="ch"><div class="chhead">'+
    '<div class="chicon" style="background:'+ch.color+'">'+ic(ch.icon,'#fff')+'</div>'+
    '<div class="chname">'+ch.name+'<small>'+((ch.bizName&&ch.bizName!==ch.name)?ch.bizName+' · ':'')+ch.sub+'</small></div>';
  if(ch.tag)h+='<div class="chtag tg-'+ch.tag[1]+'">'+ch.tag[0]+'</div>';
  h+='</div>';
  h+=kpiRow(ch.kpi);
  (ch.tables||[]).forEach(function(t){h+=tableHTML(t);});
  if(ch.changes&&ch.changes.length){
    h+='<div class="sec"><div class="sh">'+ic('cal')+' สิ่งที่ปรับระหว่างสัปดาห์</div><div class="tw"><table style="min-width:420px"><thead><tr><th>วันที่</th><th style="text-align:left">การเปลี่ยนแปลง</th></tr></thead><tbody>'+
      ch.changes.map(function(c){return '<tr><td>'+c[0]+'</td><td style="text-align:left;white-space:normal;font-weight:500;color:#3E4A5C">'+c[1]+'</td></tr>';}).join('')+
      '</tbody></table></div></div>';
  }
  if(ch.notes&&ch.notes.length){
    h+='<div class="sec">'+ch.notes.map(function(n){return '<div class="note '+(n.k||'')+'">'+n.t+'</div>';}).join('')+'</div>';
  }
  return h+'</div>';
}

/* ---- แท็บรายสัปดาห์ (สองชั้น: สัปดาห์ → แพลตฟอร์ม) ---- */
var curWeek=0, curCh=0;
function flatCh(w){
  var out=[];
  w.biz.forEach(function(b){ b.ch.forEach(function(c){ var o=Object.assign({},c); o.bizName=b.name; o.bizColor=b.color; out.push(o); }); });
  return out;
}
function weekPane(){
  var h='';
  if(WEEKS.length>1){
    h+='<div class="wsel">';
    WEEKS.forEach(function(w,i){
      h+='<button class="wbtn'+(i===curWeek?' on':'')+'" data-w="'+i+'"><div class="wt">'+w.n+'</div><div class="wr">'+w.range+'</div></button>';
    });
    h+='</div>';
  }
  var w=WEEKS[curWeek], list=flatCh(w);
  if(curCh>=list.length)curCh=0;
  h+='<div class="csel">'+list.map(function(c,i){
    return '<button class="cbtn'+(i===curCh?' on':'')+'" data-c="'+i+'" style="--cc:'+c.color+'">'+ic(c.icon)+' '+c.name+'</button>';
  }).join('')+'</div>';
  h+='<div class="card" style="padding:14px 18px"><div class="sh">'+ic('layers')+' '+w.n+' · '+w.full+'</div><div class="ss" style="margin-bottom:0">'+w.head+'</div></div>';
  if(w.warn)h+='<div class="note warn" style="margin-bottom:14px;border-radius:12px;border-left-width:4px;padding:13px 16px">'+w.warn+'</div>';
  h+=channelHTML(list[curCh]);
  return h;
}
function bindWeek(){
  document.querySelectorAll('.wbtn').forEach(function(b){
    b.onclick=function(){curWeek=+b.getAttribute('data-w');draw();window.scrollTo({top:0,behavior:'smooth'});};
  });
  document.querySelectorAll('.cbtn').forEach(function(b){
    b.onclick=function(){curCh=+b.getAttribute('data-c');draw();window.scrollTo({top:0,behavior:'smooth'});};
  });
}

/* ---- แท็บ Action Plan ---- */
var CKKEY='ads-dash-2569-10-checklist';
function ckState(){try{return JSON.parse(localStorage.getItem(CKKEY)||'{}');}catch(e){return {};}}
function ckSave(s){try{localStorage.setItem(CKKEY,JSON.stringify(s));}catch(e){}}

function planPane(){
  var DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
  var first=new Date(2026,9,1).getDay();
  var h='<div class="cal"><div class="sh">'+ic('cal')+' ปฏิทินการแก้ไข · ตุลาคม 2569</div><div class="ss">'+PLAN.calNote+'</div><div class="calgrid">';
  DOW.forEach(function(d){h+='<div class="cdow">'+d+'</div>';});
  for(var i=0;i<first;i++)h+='<div class="cday off"></div>';
  for(var d=1;d<=31;d++){
    var ev=PLAN.events[d]||[];
    var off=(d>PLAN.calLastData&&ev.length===0)?' off':'';
    h+='<div class="cday'+off+'"><div class="dn">'+d+'</div>'+
       ev.map(function(e){return '<div class="ev '+e.k+'">'+e.t+'</div>';}).join('')+'</div>';
  }
  h+='</div><div class="callg">'+
     '<span><i style="background:#E6EEFA"></i>Shopee</span>'+
     '<span><i style="background:#EDE9FA"></i>Google Ads</span>'+
     '<span><i style="background:#EAF3EC"></i>เปิดรอบใหม่ · เติมเครดิต</span>'+
     '<span><i style="background:#FDECEC"></i>หยุด / สิ้นสุดรอบ</span>'+
     '<span style="color:#9AA5B5">วันที่ 9 ต.ค. เป็นต้นไปยังไม่มีข้อมูล</span></div></div>';

  var all=[],open=0;
  PLAN.groups.forEach(function(g){g.items.forEach(function(it){all.push(it);if(it.st==='open')open++;});});
  var st=ckState();
  var ticked=all.filter(function(it,i){return st['i'+i];}).length;
  h+='<div class="ckbar"><div><div class="big">'+(all.length-open)+' / '+all.length+'</div><div class="lbl">ทำแล้ว จากงานที่ติดตามอยู่ทั้งหมด</div></div>'+
     '<div class="bar"><i style="width:'+Math.round((all.length-open)/all.length*100)+'%"></i></div>'+
     '<div style="text-align:right"><div class="big" id="cknum">'+ticked+'</div><div class="lbl">ที่คุณติ๊กเองในเครื่องนี้</div></div></div>';

  var idx=0;
  PLAN.groups.forEach(function(g){
    h+='<div class="ckgrp"><div class="ckgh">'+ic(g.icon,g.color)+' '+g.name+' <span class="badge b-info">'+g.items.length+' รายการ</span></div>';
    g.items.forEach(function(it){
      var id='i'+idx, on=!!st[id];
      h+='<div class="ck"><input type="checkbox" id="'+id+'" data-ck="'+id+'"'+(on?' checked':'')+'>'+
         '<div class="body"><div class="t'+(on?' done':'')+'">'+it.t+'</div>'+
         '<div class="d">'+it.d+'</div><div class="meta">'+
         (it.st==='done'?'<span class="badge b-done">ทำแล้ว</span>':'<span class="badge b-'+((it.weeks||0)>=3?'late':'open')+'">ยังค้าง</span>')+
         (it.when?'<span class="badge b-info">'+it.when+'</span>':'')+
         (it.weeks?'<span class="badge b-'+(it.weeks>=3?'late':'open')+'">ค้างมา '+it.weeks+' สัปดาห์</span>':'')+
         '</div>'+
         '<details><summary>ดูผลที่เกิดขึ้นและสิ่งที่ต้องทำต่อ</summary><div class="dd"><b>ผลที่เห็น:</b> '+it.res+'<br><b>สิ่งที่ต้องทำต่อ:</b> '+it.how+'</div></details>'+
         '</div></div>';
      idx++;
    });
    h+='</div>';
  });
  h+='<div class="foot">การติ๊กจะจำไว้ในเบราว์เซอร์ของเครื่องที่กดเท่านั้น คนอื่นที่เปิดลิงก์จะไม่เห็น · ป้าย “ทำแล้ว” และ “ยังค้าง” มาจากข้อมูลที่ตรวจได้ในไฟล์ ไม่ใช่จากการติ๊ก · จำนวนสัปดาห์ที่ค้างนับต่อเนื่องมาจากเดือนกันยายน</div>';
  return h;
}
function bindPlan(){
  document.querySelectorAll('[data-ck]').forEach(function(b){
    b.onchange=function(){
      var s=ckState(); s[b.getAttribute('data-ck')]=b.checked; ckSave(s);
      var t=b.parentNode.querySelector('.t'); if(t)t.classList.toggle('done',b.checked);
      var n=document.getElementById('cknum');
      if(n)n.textContent=document.querySelectorAll('[data-ck]:checked').length;
    };
  });
}

/* ---- แท็บ Monthly Summary ---- */
function monthPane(){
  var M=MONTH, W=M.waitText;
  var h='<div class="note warn" style="margin-bottom:15px;border-radius:12px;border-left-width:4px;padding:13px 16px">'+M.banner+'</div>';

  /* การ์ดสรุป 4 ใบ */
  h+='<div class="hero">'+M.hero.map(function(c){
    return '<div class="hc ph" style="--hc:'+c.c+'"><div class="hl">'+c.l+'</div>'+
           '<div class="hv phv">—</div><div class="phw">'+W+'</div><div class="hs">'+c.s+'</div></div>';
  }).join('')+'</div>';

  /* ยอดขายรายวัน */
  h+='<div class="card"><div class="sh">'+ic('chart')+' '+M.dailyTitle+'</div><div class="ss">'+M.dailySub+'</div>'+
     '<div class="phbox">'+ic('chart')+'<div><b>'+W+'</b><span>จะแสดงแท่งยอดขายรายวันของเดือนตุลาคม พร้อมจำนวนออเดอร์ของแต่ละวัน</span></div></div></div>';

  /* ค่าโฆษณาแยกช่องทาง */
  h+='<div class="card"><div class="sh">'+ic('sum')+' ค่าโฆษณาแยกตามช่องทาง</div><div class="ss">รวมทั้งเดือน '+M.range+'</div>';
  M.channels.forEach(function(c){
    h+='<div class="pbar"><div class="pn">'+c.n+'<span class="sub" style="display:block;font-weight:500;font-size:10.5px;color:var(--muted)">'+c.res+'</span></div>'+
       '<div class="track phtrack"><span>'+W+'</span></div></div>';
  });
  h+='</div>';

  h+='<div class="foot" style="background:#fff;border-radius:14px;padding:15px 18px;box-shadow:0 2px 10px rgba(31,56,100,.07)">'+M.foot+'</div>';
  return h;
}

  document.querySelectorAll('.tab').forEach(function(b){

  });
  if(curTab===0)bindWeek();
  if(curTab===1)bindPlan();
}
draw();
